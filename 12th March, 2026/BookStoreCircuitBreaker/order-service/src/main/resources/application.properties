server.port=8082
spring.application.name=order-service

spring.datasource.url=jdbc:postgresql://localhost:5432/orderdb
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=root

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost

resilience4j.circuitbreaker.instances.bookService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.bookService.sliding-window-size=6
resilience4j.circuitbreaker.instances.bookService.minimum-number-of-calls=6
resilience4j.circuitbreaker.instances.bookService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.bookService.permitted-number-of-calls-in-half-open-state=2

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
